server:
  port: 12346

spring:
  application:
    name: pet-adoption

  jackson:
    property-naming-strategy: SNAKE_CASE

  # 默认使用H2内存数据库（开发环境）
  datasource:
    url: jdbc:h2:file:./pet_adoption_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  thymeleaf:
    cache: false

# JWT Configuration
jwt:
  secret: pet-adoption-secret-key-2024-spring-boot-version-very-long-secret
  expiration: 86400000  # 24 hours in milliseconds

# File Upload Configuration
file:
  upload-dir: ./media/pets

# Logging
logging:
  level:
    com.petadoption: DEBUG
    org.springframework.security: INFO

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
